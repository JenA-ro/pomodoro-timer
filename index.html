<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
  <title>Pomotato</title>
</head>
<body>
  <header>
    <h1 id="header-title">Pomotato</h1>
    <div class="header-buttons">
      <button id="sound-btn" type="submit">
        <svg class="sound-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M20 3v14a4 4 0 1 1-2-3.465V6H9v11a4 4 0 1 1-2-3.465V3z"/></svg>
      </button>
      <button id="task-btn">
        <svg class="task-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M8 4h13v2H8zm-5-.5h3v3H3zm0 7h3v3H3zm0 7h3v3H3zM8 11h13v2H8zm0 7h13v2H8z"/></svg>
      </button>
      <button id="sign-in-btn">
        <svg class="sign-in-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12S6.48 2 12 2M6.023 15.416C7.491 17.606 9.695 19 12.16 19s4.669-1.393 6.136-3.584A8.97 8.97 0 0 0 12.16 13a8.97 8.97 0 0 0-6.137 2.416M12 11a3 3 0 1 0 0-6a3 3 0 0 0 0 6"/></svg>
        Sign in
      </button>
    </div>
  </header>
  <!-- Blurred background  -->
  <div class="overlay" id="overlay"></div>

  <!-- Sound Popup -->
  <!-- Pause button: ⏸ -->
  <div class="popup" id="sound-popup">
    <h2 class="popup-title" id="sound-title">Sounds</h2>
    <ul class="sound-list">
      <li>
        <button class="play-btn" id="brown-noise-btn">▶</button> 
        <span>Brown Noise</span>
        <div class="line"></div>
      </li>
      <li>
        <button class="play-btn" id="green-noise-btn">▶</button>
        <span>Green Noise</span>
        <div class="line"></div>
      </li>
      <li>
        <button class="play-btn" id="pink-noise-btn">▶</button>
        <span>Pink Noise</span>
        <div class="line"></div>
      </li>
      <li>
        <button class="play-btn" id="white-noise-btn">▶</button>
        <span>White Noise</span>
        <div class="line"></div>
      </li>
    </ul>
    <button class="close-btns"id="close-sound-popup">Close</button>
  </div>
  
  <!-- Task Popup -->
   <div class="popup" id="task-popup">
    <h2 class="popup-title" id="task-title">Tasks</h2>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add Task" autocomplete="off">
      <!-- <button type="submit" id="add-task-btn">+</button> -->
    </form>
    <ul class="task-list" id="task-list"></ul>
    <button class="close-btns" id="close-task-popup">Close</button>
   </div>

  <!-- Pomodoro Container -->
  <div class="pom-container">
    <!-- Header Buttons -->
    <div class="btn-container">
      <button id="pomodoro-btn" class="header-pom-btns">Pomodoro</button>
      <button id="short-break-btn" class="header-pom-btns">Short Break</button>
      <button id="long-break-btn" class="header-pom-btns">Long Break</button>
    </div>

    <div class="pomodoro-timer-container">
      <h1 id="pomodoro-timer">25:00</h1>
    </div>
    <!-- Footer BUttons -->
    <div class="btn-container">
      <button id="start-btn" class="footer-pom-btns">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M6 20.196V3.804a1 1 0 0 1 1.53-.848l13.113 8.196a1 1 0 0 1 0 1.696L7.53 21.044A1 1 0 0 1 6 20.196"/></svg>
      </button>
      <button id="resume-btn" class="footer-pom-btns">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2v2a8 8 0 1 0 5.135 1.865L15 8V2h6l-2.447 2.447A9.98 9.98 0 0 1 22 12"/>
          </svg>
      </button>
      <button id="setting-btn" class="footer-pom-btns">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="m8.686 4l2.607-2.607a1 1 0 0 1 1.414 0L15.314 4H19a1 1 0 0 1 1 1v3.686l2.607 2.607a1 1 0 0 1 0 1.414L20 15.314V19a1 1 0 0 1-1 1h-3.686l-2.607 2.607a1 1 0 0 1-1.414 0L8.686 20H5a1 1 0 0 1-1-1v-3.686l-2.607-2.607a1 1 0 0 1 0-1.414L4 8.686V5a1 1 0 0 1 1-1zM12 15a3 3 0 1 0 0-6a3 3 0 0 0 0 6"/>
        </svg>
      </button>
    </div>
  </div>

    <!-- <div class="pom-btn-container">
      <button id="start-btn" class="btns">Start</button>
      <button id="stop-btn" class="btns" >Stop</button>
      <button id="resume-btn" class="btns">Resume</button>
      <button id="reset-btn" class="btns">Reset</button>
    </div>
  </div> -->

</body>
</html>
