<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Catodoro</title>
</head>
<body>
  <h1>Catadoro</h1>

  <!-- Pomodoro Container -->
  <div class="pom-container">
    <div class="navbar">
      <ul class="tabs">
        <li><a href="a">Pomodoro</a></li>
        <li><a href="b">Break</a></li>
        <li><a href="c">Intervals</a></li>
      </ul>
    </div>

    <div class="unit">
      <p id="timer">25:00</p>
      <p id="break">5:00</p>
      <input type="number" min="1" max="10" value="1">
    </div>

    <div class="btn-container">
      <button id="start-btn" class="btns">Start</button>
      <button id="stop-btn" class="btns">Stop</button>
      <button id="reset-btn" class="btns">Reset</button>
    </div>
  </div>

</body>
</html>
