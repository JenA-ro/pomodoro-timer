<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
  <title>Pomotato</title>
</head>
<body>
  <header>
    <h1 id="header-title">Pomotato</h1>
    <div class="header-buttons">
      <button id="sound-btn" type="submit" onclick="openPopup()">
        <svg class="sound-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M20 3v14a4 4 0 1 1-2-3.465V6H9v11a4 4 0 1 1-2-3.465V3z"/></svg>
      </button>
      <button id="task-btn">
        <svg class="task-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M8 4h13v2H8zm-5-.5h3v3H3zm0 7h3v3H3zm0 7h3v3H3zM8 11h13v2H8zm0 7h13v2H8z"/></svg>
      </button>
      <button id="sign-in-btn">

        <svg class="sign-in-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Remix Icon by Remix Design - https://github.com/cyberalien/RemixIcon/blob/master/License --><path fill="currentColor" d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12S6.48 2 12 2M6.023 15.416C7.491 17.606 9.695 19 12.16 19s4.669-1.393 6.136-3.584A8.97 8.97 0 0 0 12.16 13a8.97 8.97 0 0 0-6.137 2.416M12 11a3 3 0 1 0 0-6a3 3 0 0 0 0 6"/></svg>
        Sign in
      </button>
    </div>
  </header>
  
  <!-- blurred background  -->
  <div class="overlay" id="overlay"></div>

  <!-- Sound Popup -->
  <!-- Pause button: ⏸ -->
  <div class="popup-container">
    <div class="sound-popup" id="sound-popup">
      <h2>Sounds</h2>
      <ul class="sound-list">
        <li>
          <button class="play-btn" id="brown-noise-btn">▶</button> 
          <span>Brown Noise</span>
          <input type="range">
        </li>
        <li>
          <button class="play-btn" id="green-noise-btn">▶</button>
          <span>Green Noise</span>
          <input type="range">
        </li>
        <li>
          <button class="play-btn" id="pink-noise-btn">▶</button>
          <span>Pink Noise</span>
          <input type="range">
        </li>
        <li>
          <button class="play-btn" id="white-noise-btn">▶</button>
          <span>White Noise</span>
          <input type="range">
        </li>
      </ul>
      <button id="close-sound-popup" type="submit" onclick="closePopup()">Close</button>
    </div>
</div>

  <!-- Pomodoro Container -->
  <div class="pom-container">
    <div class="navbar">
      <ul class="tabs">
        <li data-tab-target="#timer" class="curr-tab">Pomodoro</li>
        <li data-tab-target="#break" class="tab">Break</li>
        <li data-tab-target="#interval" class="tab">Intervals</li>
      </ul>
    </div>

    <div class="unit">
      <p id="timer" data-tab-content class="active">25:00</p>
      <p id="break" data-tab-content>5:00</p>
      <input type="number" min="1" max="10" value="1" id="interval" data-tab-content>
    </div>

    <p id="interval-text">Interval: 1</p>

    <div class="btn-container">
      <button id="start-btn" class="btns">Start</button>
      <button id="stop-btn" class="btns" >Stop</button>
      <button id="resume-btn" class="btns">Resume</button>
      <button id="reset-btn" class="btns">Reset</button>
    </div>
  </div>

</body>
</html>
